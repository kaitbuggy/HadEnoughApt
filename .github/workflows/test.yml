name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Load schema with a Supabase-style auth stub
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "
            create role authenticated nologin; create role anon nologin;
            create schema auth;
            create function auth.uid() returns uuid language sql stable as \$\$ select nullif(current_setting('request.jwt.claim.sub', true),'')::uuid \$\$;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/schema.sql -f db/policies.sql -f db/seed.sql
      - run: npm ci
        working-directory: scraper
      - run: npm test
        working-directory: scraper
