name: Area probe (temporary)
on:
  push:
    branches: [area-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow
      - run: |
          git fetch -q origin site-data
          git show origin/site-data:site-data.json > /tmp/sd.json
          python3 tools/area_data.py /tmp/sd.json /tmp/area.json
          cat /tmp/area.json
