name: Export site data

# Writes the public listing data (no visitor data) to site-data.json on the
# `site-data` branch, which the website reads. The branch holds a single
# commit that is replaced on every run, so history doesn't pile up.
# Then rebuilds the website from it and deploys it to GitHub Pages.
# Runs after each availability check and on demand.

on:
  workflow_run:
    workflows: ['Check availability']
    types: [completed]
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scraper/src/export.js'
      - 'scraper/src/apply-labels.js'
      - 'labels/**'
      - 'tools/area_data.py'
      - '.github/workflows/export.yml'

permissions:
  contents: write   # to update the site-data branch only

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - name: Load floor plan labels
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node src/apply-labels.js ../labels/plan-labels.json
      - name: Export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node src/export.js out/site-data.json
      - name: Publish to the site-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/site-data"
          mkdir -p "$dir" && cp out/site-data.json "$dir/"
          cd "$dir"
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data.json
          git commit -qm "Site data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/site-data
      - name: Build the website
        working-directory: .
        env:
          # Public by design (row-level security limits what they can do). Set as
          # repository variables, not secrets: Settings → Secrets and variables → Actions → Variables.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Noise and walking data, if the "Area data" workflow has run.
          if git fetch -q origin area-data 2>/dev/null && git show FETCH_HEAD:area.json > "$RUNNER_TEMP/area.json"; then
            export AREA_DATA="$RUNNER_TEMP/area.json"
            echo "Using area data from $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["generatedAt"])' "$AREA_DATA")"
          else
            echo "No area data yet; the Around this unit section is skipped."
          fi
          python3 site/build.py scraper/out/site-data.json
      - name: Package the website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-public

  deploy:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish the site
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
