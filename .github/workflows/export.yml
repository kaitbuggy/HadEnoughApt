name: Export site data

# Writes the public listing data (no visitor data) to site-data.json on the
# `site-data` branch, which the website reads. The branch holds a single
# commit that is replaced on every run, so history doesn't pile up.
# Then rebuilds the website from it and deploys it to GitHub Pages.
# Runs after each availability check and on demand.

on:
  workflow_run:
    workflows: ['Check availability']
    types: [completed]
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scraper/src/export.js'
      - 'scraper/src/apply-labels.js'
      - 'labels/**'
      - 'tools/check_drawings.py'
      - '.github/workflows/export.yml'

permissions:
  contents: write   # to update the site-data branch only
  issues: write     # to flag floor plans that need drawings

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - name: Load floor plan labels
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node src/apply-labels.js ../labels/plan-labels.json
      - name: Export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node src/export.js out/site-data.json
      - name: Publish to the site-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/site-data"
          mkdir -p "$dir" && cp out/site-data.json "$dir/"
          cd "$dir"
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data.json
          git commit -qm "Site data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/site-data
      - name: Flag floor plans that need drawings
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(python3 tools/check_drawings.py scraper/out/site-data.json labels/plan-drawings.json)"
          title="Floor plans need drawings"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$body" ]; then
            body="$body"$'\n\n'"_Updated automatically after each availability check. The weekly drawing task picks these up and opens a PR for review._"
            if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every floor plan has a drawing now."
          fi
      - name: Build the website
        working-directory: .
        run: python3 site/build.py scraper/out/site-data.json
      - name: Package the website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-public

  deploy:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish the site
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
