name: Area data (noise and walking)

# Works out noise and walking data around each building (tools/area_data.py) and
# writes it to area.json on the `area-data` branch (a single commit, replaced each
# run). Then rebuilds the website. Runs monthly and on demand; these sources change slowly.

on:
  schedule:
    - cron: '23 9 3 * *'   # 3rd of each month
  workflow_dispatch: {}

permissions:
  contents: write   # to update the area-data branch only
  actions: write    # to start "Export site data" afterwards

concurrency:
  group: area-data
  cancel-in-progress: false

jobs:
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow==11.3.0
      - name: Work out noise and walking data
        run: |
          git fetch -q origin site-data
          git show origin/site-data:site-data.json > "$RUNNER_TEMP/site-data.json"
          python3 tools/area_data.py "$RUNNER_TEMP/site-data.json" "$RUNNER_TEMP/area.json"
      - name: Publish to the area-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/area-data"
          mkdir -p "$dir" && cp "$RUNNER_TEMP/area.json" "$dir/"
          cd "$dir"
          git init -q -b area-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add area.json
          git commit -qm "Area data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/area-data
      - name: Rebuild the website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run export.yml --ref main -R "${{ github.repository }}"
