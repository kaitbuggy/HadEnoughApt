name: Check availability

on:
  schedule:
    # Twice a day, off the top of the hour (UTC). About 8:23 AM and 8:23 PM in Austin.
    - cron: '23 13 * * *'
    - cron: '23 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Skip until the database is connected
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set yet; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Scrape and record
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape
